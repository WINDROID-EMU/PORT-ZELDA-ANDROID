name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger ao criar uma tag (ex: v1.0.0)
  workflow_dispatch: # Permite iniciar manualmente pela aba Actions

permissions:
  contents: write # Necessário para o bot criar a release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug
        # Usamos assembleDebug porque gera um APK já assinado com chave de depuração, 
        # permitindo que os usuários instalem direto. (assembleRelease exige configuração de keystore).

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Zelda3-Android.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Zelda3-Android.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Para builds manuais)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Zelda3-Android-APK
          path: Zelda3-Android.apk
